name: CI

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      #- name: Test
        #run: npm run test -- --watch=false --browsers=ChromeHeadless