name: Deploy Release

on:
  workflow_dispatch:
    inputs:

      tag:
        description: "Tag à déployer"
        required: true
        type: string

      environment:
        description: "Environnement cible"
        required: true
        type: choice
        options:
          - INT
          - PROD

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate INT tag
        if: github.event.inputs.environment == 'INT'
        run: |
          TAG="${{ github.event.inputs.tag }}"

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Tag INT invalide"
            exit 1
          fi

      - name: Validate PROD tag
        if: github.event.inputs.environment == 'PROD'
        run: |
          TAG="${{ github.event.inputs.tag }}"

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag PROD invalide"
            exit 1
          fi

  deploy:
    needs: validate

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Verify PROD tag belongs to master
        if: github.event.inputs.environment == 'PROD'
        run: |
          git fetch origin master

          if ! git merge-base --is-ancestor \
            HEAD origin/master; then
            echo "Le tag ne provient pas de master"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g vercel

      - name: Deploy INT
        if: github.event.inputs.environment == 'INT'
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}

          vercel build \
            --token=${{ secrets.VERCEL_TOKEN }}

          vercel deploy \
            --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_INT_PROJECT_ID }}

      - name: Deploy PROD
        if: github.event.inputs.environment == 'PROD'
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

          vercel deploy \
            --prod \
            --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}